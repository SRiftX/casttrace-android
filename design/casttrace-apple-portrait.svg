<svg xmlns="http://www.w3.org/2000/svg" width="432" height="3200" viewBox="0 0 432 3200" role="img" aria-labelledby="title desc">
  <title id="title">CastTrace 手机竖屏设计稿</title>
  <desc id="desc">根据现有 Android 手机界面重做的直播间、开播提醒、视频库和设置页面。</desc>
  <defs>
    <style>
      text { font-family: "Roboto", "Noto Sans SC", "Microsoft YaHei UI", sans-serif; fill: #1d1d1f; }
      .title { font-size: 28px; font-weight: 600; }
      .page-title { font-size: 23px; font-weight: 650; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .tiny { font-size: 10px; }
      .secondary { fill: #6e6e73; }
      .tertiary { fill: #8e8e93; }
      .blue { fill: #007aff; }
      .orange { fill: #b86e00; }
      .green { fill: #278447; }
      .white { fill: #fff; }
      .line { stroke: #e5e5ea; }
      .icon { fill: none; stroke: #6e6e73; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .nav-active { color: #007aff; }
    </style>
    <g id="home-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 12 13-10 13 10M6 10v18h8V17h5v11h8V10"/>
    </g>
    <g id="bell-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 21h18l-2-3v-7a7 7 0 0 0-14 0v7l-2 3Zm6 4h6"/>
    </g>
    <g id="library-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="23" height="25" rx="3"/><path d="M13 9v13l9-6.5z"/>
    </g>
    <g id="settings-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="10"/><circle cx="16" cy="16" r="3"/>
      <path d="M16 2v3m0 22v3M2 16h3m22 0h3M6.1 6.1l2.1 2.1m15.6 15.6 2.1 2.1m0-19.8-2.1 2.1M8.2 23.8l-2.1 2.1"/>
    </g>
    <g id="nav-shell">
      <rect x="0" y="700" width="432" height="100" fill="#fff"/>
      <path d="M0 700h432" stroke="#e5e5ea"/>
    </g>
    <g id="nav-items" fill="none" stroke="#737378" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <use href="#home-icon" x="38" y="730" color="#737378"/>
      <use href="#bell-icon" x="146" y="730" color="#737378"/>
      <use href="#library-icon" x="254" y="730" color="#737378"/>
      <use href="#settings-icon" x="362" y="730" color="#737378"/>
    </g>
    <g id="switch-on">
      <rect width="42" height="24" rx="12" fill="#34c759"/><circle cx="29" cy="12" r="9" fill="#fff"/>
    </g>
    <g id="switch-off">
      <rect width="42" height="24" rx="12" fill="#d1d1d6"/><circle cx="13" cy="12" r="9" fill="#fff"/>
    </g>
    <g id="search-icon" fill="none" stroke="#4d4d52" stroke-width="1.8" stroke-linecap="round">
      <circle cx="9" cy="9" r="6"/><path d="m14 14 6 6"/>
    </g>
    <g id="plus-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M12 4v16M4 12h16"/>
    </g>
    <g id="chevron" fill="none" stroke="#8e8e93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="m8 10 4 4 4-4"/>
    </g>
  </defs>

  <!-- Live rooms, based on the supplied original mobile screen -->
  <g transform="translate(0 0)">
    <rect width="432" height="800" fill="#f5f5f7"/>
    <text x="20" y="36" class="title">CastTrace</text>
    <text x="20" y="57" class="small secondary">直播录制控制台</text>
    <use href="#search-icon" x="334" y="26"/>
    <use href="#plus-icon" x="382" y="26" color="#4d4d52"/>

    <text x="20" y="91" class="body" font-weight="650">录制控制</text>
    <text x="20" y="112" class="tiny secondary">全局自动录制 · 后台持续检测</text>
    <use href="#chevron" x="389" y="78"/>

    <text x="20" y="143" class="small secondary">状态筛选</text>
    <rect x="20" y="153" width="42" height="29" rx="15" fill="#e6f1ff"/>
    <text x="41" y="172" text-anchor="middle" class="tiny blue" font-weight="650">全部</text>
    <rect x="68" y="153" width="58" height="29" rx="15" fill="#f5f5f7" stroke="#d8d8dd"/>
    <text x="97" y="172" text-anchor="middle" class="tiny secondary">录制中</text>
    <rect x="132" y="153" width="58" height="29" rx="15" fill="#f5f5f7" stroke="#d8d8dd"/>
    <text x="161" y="172" text-anchor="middle" class="tiny secondary">直播中</text>
    <rect x="196" y="153" width="54" height="29" rx="15" fill="#f5f5f7" stroke="#d8d8dd"/>
    <text x="223" y="172" text-anchor="middle" class="tiny secondary">未开播</text>
    <rect x="256" y="153" width="67" height="29" rx="15" fill="#f5f5f7" stroke="#d8d8dd"/>
    <text x="289.5" y="172" text-anchor="middle" class="tiny secondary">录制错误</text>
    <rect x="329" y="153" width="66" height="29" rx="15" fill="#f5f5f7" stroke="#d8d8dd"/>
    <text x="362" y="172" text-anchor="middle" class="tiny secondary">未监控</text>

    <text x="20" y="224" class="body" font-weight="700">直播间</text>
    <text x="283" y="224" text-anchor="end" class="tiny secondary">0 个房间</text>
    <text x="412" y="224" text-anchor="end" class="tiny blue" font-weight="600">紧凑视图</text>

    <rect x="20" y="242" width="392" height="138" rx="10" fill="#fff"/>
    <text x="36" y="278" class="body" font-weight="650">还没有直播间</text>
    <text x="36" y="300" class="small secondary">添加直播地址，开始检查开播状态。</text>
    <text x="36" y="320" class="tiny secondary">全局和房间录制开关都开启后，开播时会自动保存。</text>
    <rect x="36" y="337" width="126" height="34" rx="7" fill="#007aff"/>
    <text x="99" y="359" text-anchor="middle" class="small white" font-weight="650">添加直播间</text>

    <use href="#nav-shell"/>
    <use href="#nav-items"/>
    <use href="#home-icon" x="38" y="730" class="nav-active"/>
    <text x="162" y="770" text-anchor="middle" class="tiny secondary">提醒</text>
    <text x="270" y="770" text-anchor="middle" class="tiny secondary">视频库</text>
    <text x="378" y="770" text-anchor="middle" class="tiny secondary">设置</text>
    <text x="54" y="770" text-anchor="middle" class="tiny blue" font-weight="650">直播间</text>
  </g>

  <!-- Reminders -->
  <g transform="translate(0 800)">
    <rect width="432" height="800" fill="#f5f5f7"/>
    <text x="20" y="36" class="page-title">开播提醒</text>
    <text x="20" y="57" class="small secondary">主播开播时通知你</text>
    <use href="#plus-icon" x="382" y="26" color="#4d4d52"/>

    <rect x="20" y="77" width="392" height="62" rx="12" fill="#fff"/>
    <circle cx="49" cy="108" r="17" fill="#eef5ff"/>
    <use href="#bell-icon" x="39" y="98" color="#007aff"/>
    <text x="77" y="103" class="small" font-weight="650">通知权限未开启</text>
    <text x="77" y="122" class="tiny secondary">开启系统通知后，主播开播时会提醒你。</text>
    <text x="394" y="113" text-anchor="end" class="tiny blue" font-weight="650">去开启</text>

    <text x="20" y="166" class="small secondary">状态</text>
    <rect x="20" y="175" width="392" height="34" rx="9" fill="#e5e5ea"/>
    <rect x="23" y="178" width="82" height="28" rx="7" fill="#fff"/>
    <text x="64" y="197" text-anchor="middle" class="tiny" font-weight="650">全部 0</text>
    <text x="157" y="197" text-anchor="middle" class="tiny secondary">直播中 0</text>
    <text x="255" y="197" text-anchor="middle" class="tiny secondary">提醒中 0</text>
    <text x="354" y="197" text-anchor="middle" class="tiny secondary">已暂停 0</text>

    <text x="20" y="239" class="body" font-weight="700">主播</text>
    <text x="412" y="239" text-anchor="end" class="tiny secondary">0 位</text>
    <rect x="20" y="253" width="392" height="204" rx="10" fill="#fff"/>
    <text x="216" y="300" text-anchor="middle" class="body" font-weight="700">还没有添加主播</text>
    <text x="216" y="323" text-anchor="middle" class="small secondary">添加主播后，即可单独管理开播提醒。</text>
    <rect x="132" y="345" width="168" height="36" rx="7" fill="#007aff"/>
    <text x="216" y="369" text-anchor="middle" class="small white" font-weight="650">添加主播</text>
    <text x="216" y="414" text-anchor="middle" class="small blue">从直播间导入</text>

    <use href="#nav-shell"/>
    <use href="#nav-items"/>
    <use href="#bell-icon" x="146" y="730" class="nav-active"/>
    <text x="54" y="770" text-anchor="middle" class="tiny secondary">直播间</text>
    <text x="270" y="770" text-anchor="middle" class="tiny secondary">视频库</text>
    <text x="378" y="770" text-anchor="middle" class="tiny secondary">设置</text>
    <text x="162" y="770" text-anchor="middle" class="tiny blue" font-weight="650">提醒</text>
  </g>

  <!-- Video library -->
  <g transform="translate(0 1600)">
    <rect width="432" height="800" fill="#f5f5f7"/>
    <text x="20" y="36" class="page-title">视频库</text>
    <text x="20" y="57" class="small secondary">0 场录制</text>
    <text x="412" y="57" text-anchor="end" class="tiny blue" font-weight="650">筛选与排序</text>

    <rect x="20" y="75" width="392" height="39" rx="9" fill="#fff" stroke="#dedee3"/>
    <use href="#search-icon" x="31" y="84"/>
    <text x="60" y="99" class="small tertiary">搜索主播、标题、平台或日期</text>
    <use href="#library-icon" x="200" y="259" color="#8e8e93"/>
    <text x="216" y="319" text-anchor="middle" class="body" font-weight="650">还没有录制文件</text>
    <text x="216" y="342" text-anchor="middle" class="small secondary">完成的直播录制会显示在这里。</text>
    <text x="216" y="363" text-anchor="middle" class="tiny secondary">开启自动录制，或在直播间手动开始录制。</text>
    <rect x="144" y="382" width="144" height="36" rx="7" fill="#007aff"/>
    <text x="216" y="406" text-anchor="middle" class="small white" font-weight="650">前往直播间</text>

    <use href="#nav-shell"/>
    <use href="#nav-items"/>
    <use href="#library-icon" x="254" y="730" class="nav-active"/>
    <text x="54" y="770" text-anchor="middle" class="tiny secondary">直播间</text>
    <text x="162" y="770" text-anchor="middle" class="tiny secondary">提醒</text>
    <text x="378" y="770" text-anchor="middle" class="tiny secondary">设置</text>
    <text x="270" y="770" text-anchor="middle" class="tiny blue" font-weight="650">视频库</text>
  </g>

  <!-- Settings -->
  <g transform="translate(0 2400)">
    <rect width="432" height="800" fill="#f5f5f7"/>
    <text x="20" y="36" class="page-title">设置</text>
    <text x="20" y="57" class="small secondary">录制偏好和后台运行</text>

    <text x="20" y="88" class="small secondary">录制默认值</text>
    <rect x="20" y="98" width="392" height="132" rx="12" fill="#fff"/>
    <text x="36" y="125" class="body" font-weight="600">保存目录</text>
    <text x="36" y="144" class="tiny secondary">Movies/StreamCap</text>
    <path d="M36 155h360" class="line"/>
    <text x="36" y="181" class="body" font-weight="600">默认格式</text>
    <text x="366" y="181" text-anchor="end" class="small secondary">MP4</text>
    <text x="394" y="184" text-anchor="end" class="body tertiary">›</text>
    <path d="M36 194h360" class="line"/>
    <text x="36" y="219" class="body" font-weight="600">默认清晰度</text>
    <text x="366" y="219" text-anchor="end" class="small secondary">原画</text>
    <text x="394" y="222" text-anchor="end" class="body tertiary">›</text>

    <text x="20" y="258" class="small secondary">录制和后台运行</text>
    <rect x="20" y="268" width="392" height="166" rx="12" fill="#fff"/>
    <text x="36" y="295" class="body" font-weight="600">全局自动录制</text>
    <text x="36" y="314" class="tiny secondary">主播开播后自动开始录制</text>
    <use href="#switch-on" x="352" y="282"/>
    <path d="M36 328h360" class="line"/>
    <text x="36" y="358" class="body" font-weight="600">后台持续检测</text>
    <text x="36" y="377" class="tiny secondary">关闭应用后仍检查开播状态</text>
    <use href="#switch-on" x="352" y="345"/>
    <path d="M36 391h360" class="line"/>
    <text x="36" y="417" class="body" font-weight="600">电池优化</text>
    <text x="298" y="417" text-anchor="end" class="tiny orange">尚未设置</text>
    <text x="394" y="420" text-anchor="end" class="body tertiary">›</text>

    <text x="20" y="462" class="small secondary">通知和外观</text>
    <rect x="20" y="472" width="392" height="112" rx="12" fill="#fff"/>
    <text x="36" y="500" class="body" font-weight="600">系统通知</text>
    <text x="36" y="519" class="tiny secondary">开播提醒和录制状态</text>
    <text x="394" y="508" text-anchor="end" class="body tertiary">›</text>
    <path d="M36 533h360" class="line"/>
    <text x="36" y="564" class="body" font-weight="600">外观</text>
    <text x="366" y="564" text-anchor="end" class="small secondary">跟随系统</text>
    <text x="394" y="567" text-anchor="end" class="body tertiary">›</text>

    <use href="#nav-shell"/>
    <use href="#nav-items"/>
    <use href="#settings-icon" x="362" y="730" class="nav-active"/>
    <text x="54" y="770" text-anchor="middle" class="tiny secondary">直播间</text>
    <text x="162" y="770" text-anchor="middle" class="tiny secondary">提醒</text>
    <text x="270" y="770" text-anchor="middle" class="tiny secondary">视频库</text>
    <text x="378" y="770" text-anchor="middle" class="tiny blue" font-weight="650">设置</text>
  </g>

  <path d="M0 800h432M0 1600h432M0 2400h432" stroke="#d1d1d6" stroke-width="2"/>
</svg>
