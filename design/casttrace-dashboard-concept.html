<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>CastTrace 手机界面</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --secondary: #6e6e73;
      --tertiary: #8e8e93;
      --line: #e5e5ea;
      --canvas: #f5f5f7;
      --paper: #fff;
      --soft: #f7f7f9;
      --blue: #007aff;
      --green: #34c759;
      --amber: #a96516;
      font-family: "Roboto", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
      color: var(--ink);
      background: var(--canvas);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    button { color: inherit; font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

    .viewer { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      min-height: 58px; padding: 0 26px; display: flex; align-items: center; justify-content: space-between;
      gap: 18px; background: var(--paper); border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: #fff; }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand-name { font-size: 15px; font-weight: 650; }
    .brand-note, .design-note { color: var(--secondary); font-size: 12px; }
    main.viewer-main {
      width: min(100%, 1240px); min-width: 0; min-height: 0; flex: 1; margin: 0 auto;
      padding: 16px 24px 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .toolbar { min-height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .toolbar-label { color: var(--secondary); font-size: 12px; margin-right: 8px; }
    .orientation { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }
    .orientation button {
      min-width: 66px; min-height: 30px; padding: 0 10px; border: 0; border-radius: 6px;
      background: transparent; color: var(--secondary); font-size: 12px;
    }
    .orientation button[aria-pressed="true"] { background: #ececf0; color: var(--ink); font-weight: 600; }
    .page-tabs { display: flex; gap: 24px; min-height: 40px; overflow-x: auto; border-bottom: 1px solid var(--line); }
    .page-tabs button {
      flex: 0 0 auto; min-height: 40px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent;
      background: transparent; color: var(--secondary); font-size: 13px;
    }
    .page-tabs button[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
    .stage { position: relative; min-width: 0; min-height: 260px; flex: 1; overflow: hidden; display: grid; place-items: center; }
    .screen-holder { position: absolute; top: 50%; left: 50%; width: max-content; height: max-content; transform-origin: center; }
    .screen-holder .screen { border-radius: 22px; box-shadow: 0 18px 50px #1d1d1f20; overflow: hidden; }
    .caption { min-height: 42px; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .caption-copy { min-width: 0; }
    .caption h1 { margin: 0 0 4px; font-size: 14px; font-weight: 650; }
    .caption p { margin: 0; color: var(--secondary); font-size: 12px; line-height: 1.5; }
    .caption-links { display: flex; flex: 0 0 auto; gap: 16px; }
    .caption-links a { color: var(--blue); font-size: 12px; text-decoration: none; }
    .caption-links a:hover { text-decoration: underline; }

    .screen {
      position: relative; width: 432px; height: 800px; display: flex; flex-direction: column;
      overflow: hidden; background: var(--paper); color: var(--ink); font-size: 14px;
      font-family: "Roboto", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
    }
    .screen.landscape { width: 800px; height: 432px; }
    .statusbar { height: 26px; flex: 0 0 26px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .status-icons { display: flex; align-items: center; gap: 5px; color: #3a3a3c; }
    .status-icons svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .status-icons .battery { width: 19px; }
    .app-shell { min-height: 0; flex: 1; display: flex; flex-direction: column; }
    .page-content { min-height: 0; flex: 1; overflow: auto; padding: 15px 22px 10px; scrollbar-width: none; }
    .page-content::-webkit-scrollbar { display: none; }
    .screen.live .page-content, .screen.reminders .page-content, .screen.library .page-content { display: flex; flex-direction: column; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 18px; }
    .heading-copy { min-width: 0; }
    .page-title { margin: 0; font-size: 25px; line-height: 1.15; font-weight: 650; }
    .page-subtitle { margin: 5px 0 0; color: var(--secondary); font-size: 13px; line-height: 1.35; }
    .header-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }
    .icon-action { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #4d4d52; }
    .icon-action svg { width: 22px; height: 22px; }
    .icon-action:active { background: var(--soft); }
    .screen svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .rule-panel { margin: 0 0 22px; padding: 14px 15px 13px; border-radius: 12px; background: var(--soft); }
    .rule-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--secondary); font-size: 12px; }
    .rule-heading strong { color: var(--ink); font-size: 13px; font-weight: 600; }
    .text-link { padding: 3px 0; border: 0; background: transparent; color: var(--blue); font-size: 12px; white-space: nowrap; }
    .rule-expression { display: flex; align-items: center; gap: 9px; margin: 11px 0 6px; font-size: 14px; font-weight: 600; }
    .rule-expression .operator { color: var(--blue); font-size: 17px; font-weight: 500; }
    .rule-copy { margin: 0; color: var(--secondary); font-size: 12px; line-height: 1.45; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 4px; font-size: 16px; font-weight: 600; }
    .section-count { color: var(--secondary); font-size: 12px; font-weight: 400; }
    .rooms-section, .reminder-section, .library-section { min-height: 0; display: flex; flex-direction: column; }
    .screen.live .live-layout { min-height: 0; flex: 1; display: flex; flex-direction: column; }
    .screen.live .rooms-section, .screen.reminders .reminder-section, .screen.library .library-section { flex: 1; }
    .empty-state { min-height: 210px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 18px; text-align: center; }
    .empty-icon { width: 42px; height: 42px; margin-bottom: 15px; color: #8e8e93; }
    .empty-icon svg { width: 42px; height: 42px; }
    .empty-title { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 600; }
    .empty-copy { max-width: 310px; margin: 7px 0 0; color: var(--secondary); font-size: 13px; line-height: 1.55; }
    .primary-action { min-height: 42px; margin-top: 17px; padding: 0 19px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font-size: 14px; font-weight: 600; }
    .primary-action svg { width: 17px; height: 17px; }
    .primary-action:active { background: #0066d6; }
    .secondary-action { min-height: 38px; margin-top: 3px; padding: 0 14px; border: 0; background: transparent; color: var(--blue); font-size: 13px; }
    .permission-note { min-height: 62px; margin: 0 0 14px; padding: 10px 0; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .permission-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: #d28b22; }
    .permission-copy { min-width: 0; flex: 1; }
    .permission-copy strong { display: block; font-size: 13px; font-weight: 600; }
    .permission-copy span { display: block; margin-top: 3px; color: var(--secondary); font-size: 12px; line-height: 1.35; }
    .permission-note .text-link { padding: 8px 0 8px 8px; }
    .search-row { display: flex; gap: 8px; margin: 2px 0 13px; }
    .search-field { min-width: 0; height: 42px; flex: 1; padding: 0 11px; display: flex; align-items: center; gap: 9px; border-radius: 10px; background: var(--soft); color: var(--tertiary); font-size: 12px; }
    .search-field svg { width: 18px; height: 18px; color: #626267; }
    .filter-button { min-width: 78px; height: 42px; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font-size: 12px; }
    .filter-button svg { width: 17px; height: 17px; color: var(--secondary); }
    .library-section .empty-state { padding-top: 10px; }
    .feature-note { max-width: 310px; margin: 10px 0 0; color: var(--secondary); font-size: 12px; line-height: 1.5; }
    .settings-grid { display: flex; flex-direction: column; gap: 17px; }
    .settings-group { min-width: 0; }
    .group-title { margin: 0 0 4px; color: var(--secondary); font-size: 12px; font-weight: 500; }
    .settings-list { border-top: 1px solid var(--line); }
    .setting-row { min-height: 53px; padding: 8px 2px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
    .setting-row.multiline { min-height: 66px; }
    .setting-copy { min-width: 0; flex: 1; }
    .setting-name { font-size: 14px; line-height: 1.3; font-weight: 550; }
    .setting-detail { margin-top: 3px; color: var(--secondary); font-size: 11px; line-height: 1.35; }
    .setting-value { max-width: 150px; overflow: hidden; color: var(--secondary); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .chevron { width: 15px; height: 15px; flex: 0 0 15px; color: var(--tertiary); }
    .switch { width: 38px; height: 23px; flex: 0 0 38px; position: relative; border-radius: 12px; background: #d1d1d6; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0002; }
    .switch.on { background: var(--green); }
    .switch.on::after { left: 18px; }
    .settings-footer { padding: 2px 0 4px; display: flex; flex-wrap: wrap; gap: 7px 16px; }
    .settings-footer button { padding: 5px 0; border: 0; background: transparent; color: var(--blue); font-size: 12px; }
    .bottom-nav { height: 64px; flex: 0 0 64px; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--paper); }
    .nav-item { min-width: 0; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: transparent; color: #747479; }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item span { font-size: 10px; line-height: 1.2; }
    .nav-item[aria-current="page"] { color: var(--blue); font-weight: 600; }
    .system-gesture { height: 18px; flex: 0 0 18px; display: grid; place-items: center; background: var(--paper); }
    .system-gesture span { width: 108px; height: 4px; border-radius: 4px; background: #29292d; }

    .screen.landscape .statusbar { height: 24px; flex-basis: 24px; padding: 0 22px; }
    .screen.landscape .page-content { padding: 7px 23px 6px; }
    .screen.landscape .page-header { margin-bottom: 10px; }
    .screen.landscape .page-title { font-size: 22px; }
    .screen.landscape .page-subtitle { margin-top: 3px; font-size: 12px; }
    .screen.landscape .bottom-nav { height: 54px; flex-basis: 54px; }
    .screen.landscape .nav-item { flex-direction: row; gap: 6px; }
    .screen.landscape .nav-item span { font-size: 11px; }
    .screen.landscape .system-gesture { height: 14px; flex-basis: 14px; }
    .screen.landscape .system-gesture span { width: 80px; height: 3px; }
    .screen.landscape.live .live-layout { min-height: 0; flex: 1; display: grid; grid-template-columns: 0.92fr 1.5fr; gap: 24px; }
    .screen.landscape.live .rule-panel { align-self: start; margin: 0; }
    .screen.landscape.live .rooms-section { min-height: 0; }
    .screen.landscape.live .empty-state { min-height: 0; padding: 2px 8px 0; }
    .screen.landscape.live .empty-icon { width: 32px; height: 32px; margin-bottom: 7px; }
    .screen.landscape.live .empty-icon svg { width: 32px; height: 32px; }
    .screen.landscape.live .empty-title { font-size: 15px; }
    .screen.landscape.live .empty-copy { margin-top: 4px; font-size: 12px; }
    .screen.landscape.live .primary-action { min-height: 36px; margin-top: 9px; }
    .screen.landscape.reminders .permission-note { margin-bottom: 0; }
    .screen.landscape.reminders .empty-state { min-height: 0; padding: 2px 12px; }
    .screen.landscape.reminders .empty-icon { width: 32px; height: 32px; margin-bottom: 5px; }
    .screen.landscape.reminders .empty-icon svg { width: 32px; height: 32px; }
    .screen.landscape.reminders .empty-copy { margin-top: 4px; }
    .screen.landscape.reminders .primary-action { min-height: 35px; margin-top: 8px; }
    .screen.landscape.reminders .secondary-action { min-height: 28px; }
    .screen.landscape.library .search-row { margin: 0; }
    .screen.landscape.library .library-section { min-height: 0; }
    .screen.landscape.library .empty-state { min-height: 0; padding: 1px 10px; }
    .screen.landscape.library .empty-icon { width: 31px; height: 31px; margin-bottom: 4px; }
    .screen.landscape.library .empty-icon svg { width: 31px; height: 31px; }
    .screen.landscape.library .empty-copy, .screen.landscape.library .feature-note { margin-top: 3px; font-size: 11px; }
    .screen.landscape.library .primary-action { min-height: 34px; margin-top: 6px; }
    .screen.landscape.settings .page-content { overflow: hidden; }
    .screen.landscape.settings .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .screen.landscape.settings .group-title { margin-bottom: 2px; }
    .screen.landscape.settings .setting-row { min-height: 41px; padding: 5px 2px; }
    .screen.landscape.settings .setting-row.multiline { min-height: 47px; }
    .screen.landscape.settings .setting-name { font-size: 12px; }
    .screen.landscape.settings .setting-detail, .screen.landscape.settings .setting-value { font-size: 10px; }
    .screen.landscape.settings .settings-footer { padding-top: 4px; }

    .render-surface { display: none; }
    body.render-screen, body.render-overview { min-width: 0; min-height: 0; overflow: hidden; background: #fff; }
    body.render-screen .viewer, body.render-overview .viewer { display: none; }
    body.render-screen .render-surface { display: block; width: 100vw; height: 100vh; }
    body.render-screen .screen { border-radius: 0; box-shadow: none; }
    body.render-overview .render-surface { width: 100vw; height: 100vh; display: grid; place-items: center; }
    .overview-grid { display: grid; grid-template-columns: repeat(2, max-content); gap: 18px 20px; align-items: start; justify-content: center; }
    .overview-item { display: flex; flex-direction: column; gap: 5px; }
    .overview-label { color: var(--secondary); font-size: 12px; }
    .overview-slot { position: relative; overflow: hidden; background: var(--paper); }
    .overview-slot .screen { position: absolute; inset: 0 auto auto 0; transform-origin: top left; border-radius: 0; box-shadow: none; }

    @media (max-width: 640px) {
      .topbar { min-height: 52px; padding: 0 16px; }
      .design-note { display: none; }
      main.viewer-main { padding: 10px 14px 14px; gap: 9px; }
      .toolbar { align-items: flex-start; min-height: 32px; }
      .toolbar-label { margin-right: 4px; }
      .page-tabs { gap: 18px; }
      .stage { min-height: 360px; }
      .caption { flex-direction: column; gap: 8px; }
      .caption-links { gap: 14px; }
    }
    @media (max-width: 380px) {
      .brand-note { display: none; }
      .page-content { padding-right: 17px; padding-left: 17px; }
      .rule-expression { gap: 6px; font-size: 13px; }
      .permission-copy span { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <div class="viewer">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span><span class="brand-name">CastTrace</span><span class="brand-note"> · Android 手机界面</span></span>
      </div>
      <span class="design-note">横屏与竖屏 · 四个主页面</span>
    </header>
    <main class="viewer-main">
      <div class="toolbar">
        <div><span class="toolbar-label">屏幕方向</span><span class="orientation" role="group" aria-label="屏幕方向">
          <button type="button" data-orientation="portrait" aria-pressed="true">竖屏</button>
          <button type="button" data-orientation="landscape" aria-pressed="false">横屏</button>
        </span></div>
      </div>
      <nav class="page-tabs" role="tablist" aria-label="页面">
        <button type="button" role="tab" data-page="live" aria-selected="true">直播间</button>
        <button type="button" role="tab" data-page="reminders" aria-selected="false">开播提醒</button>
        <button type="button" role="tab" data-page="library" aria-selected="false">视频库</button>
        <button type="button" role="tab" data-page="settings" aria-selected="false">设置</button>
      </nav>
      <section class="stage" aria-label="界面预览"><div class="screen-holder" id="screen-holder"></div></section>
      <section class="caption" aria-live="polite">
        <div class="caption-copy"><h1 id="page-title">直播间</h1><p id="page-copy"></p></div>
        <div class="caption-links"><a id="overview-link" href="casttrace-apple-portrait-overview.png">四页总览</a><a href="casttrace-apple-copy.md">界面文案</a></div>
      </section>
    </main>
  </div>
  <div class="render-surface" id="render-surface"></div>
  <script>
    const pageContent = {
      live: { label: "直播间", copy: "添加直播地址后开始检查开播。全局自动录制与单个房间开关都开启时，才会在开播后自动保存。" },
      reminders: { label: "开播提醒", copy: "添加主播接收开播通知，也可以从已有直播间导入；未开启通知权限时提供直达设置入口。" },
      library: { label: "视频库", copy: "搜索主播、标题或日期，并用筛选与排序整理录制；已保存视频支持播放、分享和弹幕导出。" },
      settings: { label: "设置", copy: "录制默认值、通知和后台运行分组展示；开关状态仅作视觉示意，实际值由设备配置决定。" }
    };
    const pageNames = ["live", "reminders", "library", "settings"];
    const navItems = [
      ["live", "直播间", "home"], ["reminders", "提醒", "bell"],
      ["library", "视频库", "video"], ["settings", "设置", "settings"]
    ];
    const iconPaths = {
      home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
      bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
      video: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4z"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 2.9-.2-.1a1.7 1.7 0 0 0-1.9.1l-.2.1h-3.4l-.1-.2a1.7 1.7 0 0 0-1.7-1l-.2.1-3-1.7.1-.2a1.7 1.7 0 0 0-.1-1.9l-.1-.2v-3.4l.2-.1a1.7 1.7 0 0 0 1-1.7l-.1-.2 1.7-3 .2.1a1.7 1.7 0 0 0 1.9-.1l.2-.1h3.4l.1.2a1.7 1.7 0 0 0 1.7 1l.2-.1 3 1.7-.1.2a1.7 1.7 0 0 0 .1 1.9l.1.2v3.4z"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      search: '<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/>',
      stream: '<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8m-4-3v3m-1-13 5 3-5 3z"/>',
      filter: '<path d="M4 6h16M7 12h10m-7 6h4"/><circle cx="8" cy="6" r="1.5" fill="currentColor"/><circle cx="15" cy="12" r="1.5" fill="currentColor"/>',
      folder: '<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      chevron: '<path d="m9 18 6-6-6-6"/>',
      shield: '<path d="M12 3 20 6v5c0 5-3.4 8.3-8 10-4.6-1.7-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/>',
      sliders: '<path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
      bellSmall: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>'
    };
    function icon(name, className = "") {
      return `<svg class="${className}" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]}</svg>`;
    }
    function statusIcons() {
      return `<div class="status-icons" aria-hidden="true">
        <svg viewBox="0 0 18 18"><path d="M2 6a10 10 0 0 1 14 0M5 9a6 6 0 0 1 8 0m-5 3a2 2 0 0 1 2 0"/><circle cx="9" cy="14" r=".7" fill="currentColor" stroke="none"/></svg>
        <svg viewBox="0 0 18 18"><path d="M3 13V9m4 4V6m4 7V4m4 9V2"/></svg>
        <svg class="battery" viewBox="0 0 22 16"><rect x="1" y="2" width="17" height="12" rx="2"/><path d="M20 6v4"/><path d="M4 5h10v6H4z" fill="currentColor" stroke="none"/></svg>
      </div>`;
    }
    function header(title, subtitle, actions = "") {
      return `<header class="page-header"><div class="heading-copy"><h1 class="page-title">${title}</h1><p class="page-subtitle">${subtitle}</p></div><div class="header-actions">${actions}</div></header>`;
    }
    function action(name, label) { return `<button class="icon-action" type="button" aria-label="${label}" title="${label}">${icon(name)}</button>`; }
    function emptyState(symbol, title, copy, actionLabel, secondary = "") {
      return `<div class="empty-state"><div class="empty-icon">${icon(symbol)}</div><h2 class="empty-title">${title}</h2><p class="empty-copy">${copy}</p><button class="primary-action" type="button">${icon("plus")}${actionLabel}</button>${secondary ? `<button class="secondary-action" type="button">${secondary}</button>` : ""}</div>`;
    }
    function settingsRow(name, detail, trailing, multiline = false) {
      return `<div class="setting-row${multiline ? " multiline" : ""}"><div class="setting-copy"><div class="setting-name">${name}</div>${detail ? `<div class="setting-detail">${detail}</div>` : ""}</div>${trailing}</div>`;
    }
    function group(title, rows) { return `<section class="settings-group"><h2 class="group-title">${title}</h2><div class="settings-list">${rows}</div></section>`; }
    function pageMarkup(page) {
      if (page === "live") return `
        ${header("直播间", "监控开播状态与录制任务", action("search", "搜索直播间") + action("plus", "添加直播间"))}
        <div class="live-layout">
          <section class="rule-panel" aria-label="自动录制条件">
            <div class="rule-heading"><strong>自动录制的条件</strong><button class="text-link" type="button">了解规则</button></div>
            <div class="rule-expression"><span>全局自动录制</span><span class="operator">+</span><span>房间开关</span></div>
            <p class="rule-copy">两项都开启后，主播开播时才会自动保存。</p>
          </section>
          <section class="rooms-section"><div class="section-heading">直播间 <span class="section-count">0 个</span></div>
            ${emptyState("stream", "先添加一个直播间", "粘贴直播地址后，CastTrace 会开始检查开播状态。", "添加直播间")}
          </section>
        </div>`;
      if (page === "reminders") return `
        ${header("开播提醒", "关注主播，开播时通知你", action("plus", "添加主播"))}
        <section class="reminder-section">
          <div class="permission-note"><span class="permission-dot" aria-hidden="true"></span><div class="permission-copy"><strong>通知权限未开启</strong><span>开启系统通知后，主播开播时会提醒你。</span></div><button class="text-link" type="button">去设置</button></div>
          ${emptyState("bellSmall", "还没有关注的主播", "添加主播，或从已有直播间导入。", "添加主播", "从直播间导入")}
        </section>`;
      if (page === "library") return `
        ${header("视频库", "已保存的直播录制", "")}
        <div class="search-row"><div class="search-field">${icon("search")}<span>搜索主播、标题或日期</span></div><button class="filter-button" type="button">${icon("filter")}筛选</button></div>
        <section class="library-section"><div class="section-heading">全部录制 <span class="section-count">0 场</span></div>
          ${emptyState("video", "还没有录制文件", "完成的直播录制会保存在这里。", "前往直播间")}
          <p class="feature-note">已保存的视频可以播放、分享，也可以导出带弹幕版本。</p>
        </section>`;
      return `
        ${header("设置", "录制偏好与后台运行", "")}
        <div class="settings-grid">
          ${group("录制默认值", settingsRow("保存目录", "Movies/StreamCap", icon("chevron", "chevron"), true) + settingsRow("默认格式", "", `<span class="setting-value">MP4</span>${icon("chevron", "chevron")}`) + settingsRow("默认清晰度", "", `<span class="setting-value">原画</span>${icon("chevron", "chevron")}`))}
          ${group("后台运行", settingsRow("全局自动录制", "开播后自动开始录制", '<span class="switch" aria-label="关闭"></span>', true) + settingsRow("后台持续检测", "离开应用后继续检查开播状态", '<span class="switch on" aria-label="开启"></span>', true) + settingsRow("电池优化", "允许后台任务持续运行", `<span class="setting-value">查看状态</span>${icon("chevron", "chevron")}`))}
          ${group("通知与外观", settingsRow("系统通知", "开播提醒和录制状态", icon("chevron", "chevron"), true) + settingsRow("外观", "", `<span class="setting-value">跟随系统</span>${icon("chevron", "chevron")}`))}
        </div>
        <div class="settings-footer"><button type="button">存储管理</button><button type="button">备份与恢复</button><button type="button">平台适配</button><button type="button">使用说明</button></div>`;
    }
    function createScreen(orientation, page) {
      const screen = document.createElement("div");
      screen.className = `screen ${orientation} ${page}`;
      screen.style.width = orientation === "portrait" ? "432px" : "800px";
      screen.style.height = orientation === "portrait" ? "800px" : "432px";
      screen.innerHTML = `<div class="statusbar"><span>9:41</span>${statusIcons()}</div>
        <div class="app-shell"><main class="page-content">${pageMarkup(page)}</main>
          <nav class="bottom-nav" aria-label="主导航">${navItems.map(([id, label, glyph]) => `<button class="nav-item" type="button"${id === page ? ' aria-current="page"' : ""}>${icon(glyph)}<span>${label}</span></button>`).join("")}</nav>
          <div class="system-gesture" aria-hidden="true"><span></span></div>
        </div>`;
      return screen;
    }
    const query = new URLSearchParams(location.search);
    let orientation = query.get("orientation") === "landscape" ? "landscape" : "portrait";
    let page = pageContent[query.get("page")] ? query.get("page") : "live";
    const overviewLink = document.getElementById("overview-link");
    function renderPreview() {
      document.querySelectorAll("#screen-holder .screen").forEach((old) => old.remove());
      const screen = createScreen(orientation, page);
      const holder = document.getElementById("screen-holder");
      holder.append(screen);
      const stage = document.querySelector(".stage");
      const scale = Math.min((stage.clientWidth - 28) / (orientation === "portrait" ? 432 : 800), (stage.clientHeight - 20) / (orientation === "portrait" ? 800 : 432), 1);
      holder.style.transform = `translate(-50%, -50%) scale(${Math.max(scale, 0.25)})`;
      document.getElementById("page-title").textContent = pageContent[page].label;
      document.getElementById("page-copy").textContent = pageContent[page].copy;
      overviewLink.href = `casttrace-apple-${orientation}-overview.png`;
      document.querySelectorAll(".orientation button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.orientation === orientation)));
      document.querySelectorAll("[data-page]").forEach((button) => button.setAttribute("aria-selected", String(button.dataset.page === page)));
      document.body.dataset.orientation = orientation;
    }
    document.querySelectorAll(".orientation button").forEach((button) => button.addEventListener("click", () => { orientation = button.dataset.orientation; renderPreview(); }));
    document.querySelectorAll("[data-page]").forEach((button) => button.addEventListener("click", () => { page = button.dataset.page; renderPreview(); }));
    window.addEventListener("resize", renderPreview);

    const renderMode = query.get("render");
    if (renderMode === "screen") {
      document.body.classList.add("render-screen");
      document.getElementById("render-surface").append(createScreen(orientation, page));
    } else if (renderMode === "overview") {
      document.body.classList.add("render-overview");
      const grid = document.createElement("div");
      grid.className = "overview-grid";
      const screenWidth = orientation === "portrait" ? 432 : 800;
      const screenHeight = orientation === "portrait" ? 800 : 432;
      const scale = orientation === "portrait" ? 0.68 : 0.64;
      grid.style.setProperty("--overview-scale", scale);
      for (const id of pageNames) {
        const item = document.createElement("div");
        item.className = "overview-item";
        item.innerHTML = `<div class="overview-label">${pageContent[id].label}</div><div class="overview-slot" style="width:${screenWidth * scale}px;height:${screenHeight * scale}px"></div>`;
        const slot = item.querySelector(".overview-slot");
        const screen = createScreen(orientation, id);
        screen.style.transform = `scale(${scale})`;
        slot.append(screen);
        grid.append(item);
      }
      document.getElementById("render-surface").append(grid);
    } else {
      renderPreview();
    }
  </script>
</body>
</html>
