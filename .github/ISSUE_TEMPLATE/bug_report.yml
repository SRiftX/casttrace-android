name: Bug 报告
description: 报告可复现的应用问题
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 请勿上传 Cookie、账号信息、设备序列号、原始私人日志或录制文件。安全漏洞请先阅读 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 应用版本或提交
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 手机型号和系统版本
      description: 后台问题请同时说明充电、网络、电池优化和应用启动管理设置。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据（可选）
      description: 仅提供相关错误摘要；录制问题请说明实际持续时间和保存状态。
